# D10: prove that the lockfile installs and everything runs on a clean machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # D61: unit tests on every OS; macOS installs a different XGBoost package (D4).
  tests:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      # XGBoost's macOS wheel links Homebrew's OpenMP runtime without bundling it (D4, D61).
      - name: Install OpenMP (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install dependencies from the lockfile
        run: uv sync --locked

      - name: Unit tests
        run: uv run pytest

  # D61: lint and the full notebook on Linux only; their results don't depend on the OS.
  notebook:
    name: Lint and notebook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies from the lockfile
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      # Model tuning takes ~7 min on the GitHub runner; nbmake's default cell limit is 5 min.
      - name: Execute the notebook end-to-end (incl. data download)
        run: uv run pytest --nbmake --nbmake-timeout=1800 churn_prediction.ipynb
